
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello | Khushi Shukla</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root {
    --bg: #080810;
    --purple: #a855f7;
    --pink: #ec4899;
    --cyan: #22d3ee;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: white;
    min-height: 100vh;
    overflow: hidden;
}

/* Animated background */

.background {
    position: fixed;
    inset: 0;
    z-index: -2;
    overflow: hidden;
}

.orb {
    position: absolute;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.35;
    animation: float 12s ease-in-out infinite alternate;
}

.orb1 {
    background: var(--purple);
    top: -150px;
    left: -100px;
}

.orb2 {
    background: var(--pink);
    bottom: -150px;
    right: -100px;
    animation-delay: -5s;
}

.orb3 {
    background: #4f46e5;
    top: 40%;
    left: 40%;
    width: 300px;
    height: 300px;
    animation-delay: -3s;
}

@keyframes float {
    0% {
        transform: translate(0, 0) scale(1);
    }
    100% {
        transform: translate(100px, -80px) scale(1.2);
    }
}

/* Grid effect */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: linear-gradient(to bottom, black, transparent);
}

/* Main container */

.container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.hero {
    text-align: center;
    max-width: 850px;
    animation: reveal 1.2s ease forwards;
}

@keyframes reveal {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Badge */

.badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 50px;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(15px);
    font-size: 13px;
    color: #d4d4d8;
    margin-bottom: 35px;
}

.status {
    width: 8px;
    height: 8px;
    background: #4ade80;
    border-radius: 50%;
    box-shadow: 0 0 12px #4ade80;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    50% {
        opacity: 0.4;
        transform: scale(0.7);
    }
}

/* Heading */

h1 {
    font-size: clamp(45px, 8vw, 100px);
    font-weight: 900;
    letter-spacing: -5px;
    line-height: 1.05;
}

.gradient-text {
    background: linear-gradient(
        90deg,
        #c084fc,
        #f472b6,
        #67e8f9,
        #c084fc
    );
    background-size: 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: gradient 6s linear infinite;
}

@keyframes gradient {
    0% { background-position: 0%; }
    100% { background-position: 300%; }
}

/* Typing text */

.subtitle {
    font-size: clamp(16px, 3vw, 22px);
    color: #a1a1aa;
    margin-top: 25px;
    line-height: 1.8;
}

.typing {
    color: white;
    font-weight: 600;
    border-right: 2px solid var(--pink);
    padding-right: 5px;
    animation: cursor 0.8s infinite;
}

@keyframes cursor {
    50% { border-color: transparent; }
}

/* Description */

.description {
    max-width: 570px;
    margin: 25px auto;
    color: #71717a;
    font-size: 15px;
    line-height: 1.8;
}

/* Buttons */

.buttons {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 40px;
    flex-wrap: wrap;
}

.btn {
    padding: 15px 28px;
    text-decoration: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    transition: all 0.3s ease;
}

.primary {
    color: white;
    background: linear-gradient(135deg, #9333ea, #ec4899);
    box-shadow: 0 0 25px rgba(168,85,247,0.25);
}

.primary:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 40px rgba(236,72,153,0.5);
}

.secondary {
    color: white;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.04);
}

.secondary:hover {
    background: rgba(255,255,255,0.1);
    transform: translateY(-5px);
}

/* Footer */

.footer {
    margin-top: 70px;
    color: #52525b;
    font-size: 12px;
    letter-spacing: 2px;
}

.footer span {
    color: var(--pink);
}

/* Responsive */

@media(max-width: 600px) {
    h1 {
        letter-spacing: -2px;
    }

    .description {
        font-size: 14px;
    }

    .footer {
        margin-top: 45px;
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
</div>

<div class="container">
    <main class="hero">

        <div class="badge">
            <span class="status"></span>
            Welcome to my digital universe
        </div>

        <h1>
            Hey, I'm<br>
            <span class="gradient-text">Khushi Shukla.</span>
        </h1>

        <p class="subtitle">
            I'm a <span class="typing" id="typing"></span>
        </p>

        <p class="description">
            Turning imagination into reality through code and creativity.
            Exploring new technologies, building cool things,
            and creating something extraordinary every day.
        </p>

        <div class="buttons">
            <a href="cv.html"
               target="_blank"
               rel="noopener noreferrer"
               class="btn primary">
                ✦ View My CV
            </a>

            <a href="https://github.com/khushiishukla?tab=repositories"
               target="_blank"
               rel="noopener noreferrer"
               class="btn secondary">
                View Projects ↗
            </a>
        </div>

        <div class="footer">
            DESIGNED WITH <span>♥</span> & CODE
        </div>

    </main>
</div>

<script>
const words = [
    "Developer 💻",
    "Creative Thinker ✨",
    "Tech Enthusiast 🚀",
    "Dreamer 🌙"
];

const typingElement = document.getElementById("typing");

let wordIndex = 0;
let charIndex = 0;
let deleting = false;

function typeEffect() {
    const currentWord = words[wordIndex];

    if (!deleting) {
        typingElement.textContent =
            currentWord.substring(0, charIndex + 1);

        charIndex++;

        if (charIndex === currentWord.length) {
            deleting = true;
            setTimeout(typeEffect, 1500);
            return;
        }
    } else {
        typingElement.textContent =
            currentWord.substring(0, charIndex - 1);

        charIndex--;

        if (charIndex === 0) {
            deleting = false;
            wordIndex = (wordIndex + 1) % words.length;
        }
    }

    setTimeout(typeEffect, deleting ? 40 : 90);
}

typeEffect();

// Interactive mouse glow

document.addEventListener("mousemove", (e) => {
    const x = e.clientX / window.innerWidth;
    const y = e.clientY / window.innerHeight;

    document.querySelector(".orb3").style.transform =
        `translate(${x * 80}px, ${y * 80}px)`;
});
</script>

</body>
</html>
